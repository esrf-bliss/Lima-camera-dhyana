stages:
  - build
  - build-noarch
  - deploy

.build-conda: &build-conda
  stage: build
  artifacts:
    paths:
      - dist/
  tags:
    - conda

build-linux:
  <<: *build-conda
  script:
    - conda config --set channel_priority flexible
    - conda mambabuild ./conda/camera --output-folder=dist/ -c conda-forge -c http://bcu-ci.esrf.fr/stable
  tags:
    - linux

build-noarch:
  <<: *build-conda
  stage: build-noarch
  script:
    - conda config --set channel_priority flexible
    - conda mambabuild ./conda/tango --output-folder=dist/ -c conda-forge -c http://bcu-ci.esrf.fr/stable
  dependencies:
    - build-linux
  tags:
    - linux

deploy-devel:
  stage: deploy
  environment:
    name: devel/$CI_COMMIT_REF_NAME
    url: http://bcu-ci.esrf.fr/devel
  dependencies:
    - build-linux
    - build-noarch
  script:
    - cp -Rf dist/* /conda-devel/
    - flock /conda-devel/.reindex.lock -c "conda index --channeldata /conda-devel/"
  tags:
    - conda
    - linux
  only:
    - branches
  except:
    - master
  when: manual

deploy-stable:
  stage: deploy
  environment:
    name: production
    url: http://bcu-ci.esrf.fr/stable
  dependencies:
    - build-linux
    - build-noarch
  script:
    - cp -Rf dist/* /conda/
    - flock /conda/.reindex.lock -c "conda index --channeldata /conda/"
  tags:
    - conda
    - linux
  only:
    - tags
